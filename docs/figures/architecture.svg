<text x="620.0" y="560" font-size="12" text-anchor="middle" fill="#2c6135" font-weight="bold" font-style="normal">Garanties par construction, quelle que soit l'entrée :  HLC = HLC<tspan dy="4" font-size="9">ext</tspan><tspan dy="-4"> + HLC</tspan><tspan dy="4" font-size="9">mit</tspan><tspan dy="-4">,  0 &lt; τ</tspan><tspan dy="4" font-size="9">n</tspan><tspan dy="-4"> ≤ τ</tspan><tspan dy="4" font-size="9">∞</tspan><tspan dy="-4"> ≤ τ</tspan><tspan dy="4" font-size="9">b</tspan><tspan dy="-4">,  indicateurs positifs</tspan></text>

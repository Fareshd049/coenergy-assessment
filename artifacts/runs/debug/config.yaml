name: debug
data:
  folder: data/quentin_house
  train_batches:
  - 0
  - 1
  val_batches:
  - 14
  test_batches:
  - 17
  per_batch_train: 2000
  per_batch_eval: 1000
  log_cdt: true
model:
  arch: cnn_gru
  head: share
  use_derivative: true
  predict_uncertainty: true
  seq_len: 480
  conv_channels: 32
  gru_hidden: 32
  gru_layers: 1
  bidirectional: true
  mlp_hidden: 256
  dropout: 0.1
loss:
  kind: nll
  beta: 0.5
  huber_delta: 1.0
  family_weights:
    HLC: 1.0
    Hb: 1.0
    CDT: 1.0
train:
  epochs: 4
  batch_size: 128
  lr: 0.002
  weight_decay: 0.0001
  warmup_epochs: 1.0
  mse_warmup_epochs: 1
  grad_clip: 1.0
  patience: 3
  noise_temp_std: 0.0
  amp: false
  device: auto
  num_workers: 0
  seed: 0

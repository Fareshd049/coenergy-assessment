[project]
name = "coenergy-assessment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fares", email = "fareselhamdaoui@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
]

[project.scripts]
coenergy-assessment = "coenergy_assessment:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hlcnet"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

# Final model: all 14 training files (700 000 simulations), same architecture as configs/cnn_gru_share_nll.yaml.
name: final_700k
data:
  folder: data/quentin_house
  per_batch_train: null
  per_batch_eval: 10000
model:
  arch: cnn_gru
  head: share
  use_derivative: true
  predict_uncertainty: true
  conv_channels: 64
  gru_hidden: 64
  gru_layers: 2
  bidirectional: true
loss:
  kind: nll
  beta: 0.5
train:
  epochs: 40
  batch_size: 256
  lr: 0.002
  mse_warmup_epochs: 2
  patience: 8
  noise_temp_std: 0.0
  amp: true
  device: auto
  num_workers: 2

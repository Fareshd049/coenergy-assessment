# Quick end-to-end check on CPU (a few minutes): 2 training files, 1 validation file.
name: debug
data:
  folder: data/quentin_house
  train_batches: [0, 1]
  val_batches: [14]
  test_batches: [17]
  per_batch_train: 2000
  per_batch_eval: 1000
model:
  arch: cnn_gru
  head: share
  use_derivative: true
  predict_uncertainty: true
  conv_channels: 32
  gru_hidden: 32
  gru_layers: 1
loss:
  kind: nll
  beta: 0.5
train:
  epochs: 4
  batch_size: 128
  lr: 0.002
  mse_warmup_epochs: 1
  patience: 3
  amp: false
  device: auto

# Architecture variant: TCN only, no recurrence.
# Same data, head, loss and training as configs/cnn_gru_share_nll.yaml.
name: abl_tcn
data:
  folder: data/quentin_house
  per_batch_train: 10000
  per_batch_eval: 5000
model:
  arch: tcn
  head: share
  use_derivative: true
  predict_uncertainty: true
  conv_channels: 64
  gru_hidden: 64
  gru_layers: 2
  bidirectional: true
  tcn_levels: 6
  tcn_kernel: 5
loss:
  kind: nll
  beta: 0.5
train:
  epochs: 30
  batch_size: 256
  lr: 0.002
  mse_warmup_epochs: 2
  patience: 6
  noise_temp_std: 0.0
  amp: true
  device: auto
  num_workers: 2
